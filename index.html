<body><div class="progress" id="progress"></div>
<header class="top"><button class="mobile-menu" id="menuBtn" aria-label="打开目录">目录</button><div class="brand">高性价比人生指南</div><div class="topnote">全书34节</div><div class="tools"><input id="search" class="search" type="search" placeholder="搜索关键词…（按 / 聚焦）" aria-label="搜索全文"><button id="themeBtn">夜间</button></div></header>
<div class="layout"><aside class="sidebar" id="sidebar"><p class="side-label">目录 · CONTENTS</p><nav class="nav" id="nav"></nav></aside><main class="main"><div class="intro" id="intro"><div class="eyebrow">A FIELD GUIDE TO EVERYDAY LIFE</div><h1>把日子过得更好一点</h1><p>不是人生标准答案，只是一份可以随时翻阅、慢慢补充的个人指南。</p><p>从认识自己，到行动、工作、关系与生活。读到有用的部分，就试着用起来。</p><div class="meta"><span id="count">8 个主题 · 40 条建议</span>　·　持续更新</div></div><div class="filters" id="filters"></div><div id="content"></div><p class="empty" id="empty">没有找到相关内容。试试其他关键词。</p><div class="footer">写给日常生活的备忘录。允许修改，允许推翻，也允许慢慢来。</div></main></div>
<script>
const guide=[
{title:'身体健康',lead:'第一部分讲身体健康的重要性。闹革命首先要有身体做本钱，其他的都另说。',items:[
['保证每天7.5h的睡眠时间','“充足睡眠保证了白天工作和学习的高效有序。'],
['每天至少走15000步','需要保证基本的运动量来维持身体健康'],
['记录能量变化','比起抽象地问“我喜欢什么”，观察做完一件事后更有精神还是更疲惫，往往更具体。','连续一周记录让你充电和耗电的活动。'],
['接受自己的限制','时间、精力、金钱和能力都有上限。承认限制不是认输，而是把资源用在更重要的地方。','列出当前最真实的三个限制，并写下可调整的一项。'],
['减少自我比较','你看到的是别人生活的一部分，却容易拿它和自己完整的生活比较。比较可以提供信息，不必成为价值判断。','把“我不如别人”改写成“我具体想提升哪一项能力”。']]},
{title:'行动与习惯',lead:'让好选择更容易发生，让开始一件事不再那么费力。',items:[
['把目标缩小到下一步','“变得自律”很难执行；“晚饭后读五页书”则清楚得多。目标越具体，越容易启动。','把一个大目标改写成十分钟内可以开始的动作。'],
['先建立稳定，再追求强度','偶尔做很多，未必比长期做一点更有用。习惯的价值在于减少每次重新决定的成本。','为想坚持的事情设一个小到不容易失败的最低标准。'],
['给行动设置触发点','“有空就做”通常意味着很难发生。把行动绑定到时间、地点或已有习惯，会更容易记住。','使用“当我做完 X，就做 Y”的句式安排一个行动。'],
['降低开始的摩擦','把运动服提前放好、把书放在桌面、把手机放远一点，都能减少启动前的犹豫。','检查一件重要事情的准备过程，删掉一个不必要的步骤。'],
['允许中断后重新开始','一次中断不等于习惯失败。真正重要的不是永远不偏离，而是偏离后能否回到轨道。','提前想好：如果某天没做到，第二天如何恢复。']]},
{title:'学习与思考',lead:'积累知识，也训练自己判断信息、理解问题的能力。',items:[
['主动回忆胜过反复阅读','熟悉感容易让人误以为自己已经掌握。合上材料后尝试讲出来，才能暴露真正的理解缺口。','读完一节后，用自己的话写下三个要点。'],
['间隔复习','把复习分散在不同时间，通常比一次集中重复更利于长期记忆。','为重要内容安排隔天、一周后和一个月后的简短回顾。'],
['先问问题再找答案','带着问题阅读，会更容易识别信息的相关性，也更容易把知识组织起来。','阅读前先写下自己最想弄明白的一个问题。'],
['区分观点与证据','一个说法听起来合理，不代表它已经被证实。留意来源、样本、利益关系和是否存在其他解释。','看到一个强结论时，追问“有什么证据？证据能说明到什么程度？”'],
['把输入变成输出','笔记、讲解、写作或实践，都会迫使你重新组织知识，帮助发现理解上的空白。','每周选一个学到的概念，写成一段能让外行看懂的解释。']]},
{title:'工作与职业',lead:'职业发展不是一次选对，而是持续积累可迁移的能力和可信赖的成果。',items:[
['用成果描述工作','职责说明别人知道你做过什么；成果则能让别人判断你解决了什么问题。尽量说明背景、行动和变化。','把简历中的一条职责改成“问题—行动—结果”的表达。'],
['建立可展示的作品','项目记录、分析报告、流程优化案例和作品集，都能把能力从口头描述变成可检查的证据。','每完成一项工作，留下一份去敏后的成果或复盘。'],
['主动澄清预期','很多返工来自对目标、优先级和交付标准的理解不一致。开始前确认，比结束后解释更省成本。','接到任务时确认截止时间、交付形式和成功标准。'],
['学会管理向上沟通','沟通不只是汇报进度，也包括提前暴露风险、说明取舍并给出可选方案。','汇报问题时同时带上影响、原因和建议动作。'],
['积累可迁移能力','行业会变化，表达、分析、协作、项目推进和学习能力可以跨场景使用。','每季度复盘一次：哪些能力换个岗位仍然有价值？']]},
{title:'时间与注意力',lead:'时间管理的核心不只是塞进更多事情，而是把注意力留给值得做的事。',items:[
['每天只确定少数重点','待办清单可以很长，但一天真正需要推进的关键事项通常有限。优先级意味着主动放弃一部分事情。','每天开始时选出最多三件最重要的任务。'],
['把日历当作现实约束','计划写在清单里不代表会发生。把重要任务安排到具体时段，才能看见时间是否真的够用。','为一项重要任务预留不被打扰的时间块。'],
['减少频繁切换','每次切换任务都需要重新理解上下文。把相似的沟通、处理和整理任务集中完成，往往更高效。','为消息、邮件或零碎事务设置固定处理时段。'],
['主动设计休息','休息不是完成所有任务后的奖励，而是维持注意力和情绪稳定的一部分。','在日程中提前安排短暂走动、喝水或远离屏幕的时间。'],
['定期清理数字环境','通知、标签页和堆积的文件会不断争夺注意力，也增加寻找信息的成本。','关闭一个不必要的通知，或整理一个常用文件夹。']]},
{title:'金钱与生活',lead:'让钱服务于生活目标，先建立安全感，再考虑增长和优化。',items:[
['先看清现金流','知道钱从哪里来、花到哪里去，比一开始追求复杂的预算模型更重要。','连续记录一个月支出，并按类别归纳。'],
['优先建立应急储备','突发支出可能迫使人借高成本的钱或仓促做决定。储备金能提供缓冲和选择空间。','根据必要生活支出，制定一个逐步积累的储备目标。'],
['把总成本算进去','购买时的价格只是成本的一部分；维护、时间、空间、替换频率和使用体验也值得考虑。','买东西前问：我会用多少次？它替代了什么？'],
['警惕高回报承诺','收益越高、越稳定、越没有风险的承诺，越值得认真核实。理解产品比追逐热点更重要。','做财务决定前，先弄清最坏情况下会损失什么。'],
['为重要体验留预算','金钱的意义不只是积累，也包括支持健康、关系、自由和真正重视的体验。','给一项重要但总被推迟的体验，设一个可承受的预算。']]},
{title:'关系与沟通',lead:'好的关系不是永远没有冲突，而是能够诚实表达、互相尊重并修复问题。',items:[
['表达感受而非指控','“你从来不在乎我”容易引发防御；描述具体行为和自己的感受，更有机会开启对话。','尝试使用“发生了什么—我有什么感受—我希望怎样”的表达。'],
['认真倾听对方','倾听不等于同意，而是先弄清对方真正想表达什么，再决定如何回应。','回应前先用自己的话复述对方的意思，确认理解是否准确。'],
['把边界说清楚','边界不是控制别人，而是说明自己能接受什么、不能接受什么，以及自己会如何行动。','对一件让你为难的事，练习给出清楚而礼貌的答复。'],
['冲突时先降温','情绪强烈时，人容易把注意力放在赢得争论，而不是解决问题。短暂暂停可以避免说出难以收回的话。','约定一个暂停信号，并明确什么时候继续谈。'],
['看长期行为而非单次承诺','关系中的可靠性通常体现在反复出现的行动里，而不是某一次动人的表达。','观察对方是否持续尊重约定、边界和彼此的需要。']]},
{title:'健康与能量',lead:'照顾身体不是追求完美状态，而是为生活提供更稳定的基础。',items:[
['尽量保持规律睡眠','稳定的睡眠时间和足够睡眠机会，有助于维持注意力、情绪和日常功能。','先固定一个容易做到的起床时间，再逐步调整作息。'],
['让运动容易发生','不必一开始就追求高强度训练。能持续的活动，比短期过度用力更适合长期生活。','选择一种你不讨厌的活动，从短时、低门槛开始。'],
['让日常饮食更均衡','饮食不必追求每餐完美，长期多样、适量和稳定更有现实意义。','下一餐试着增加一种蔬菜或其他你平时吃得少的食物。'],
['留意持续的身心信号','长期疲惫、情绪低落或身体不适值得认真对待，不必把所有问题都归结为意志力不足。','如果症状持续、加重或影响生活，考虑向合格专业人士求助。'],
['建立低成本恢复方式','恢复精力不一定需要昂贵消费。散步、安静独处、与信任的人交谈都可能有帮助。','列出三种你可以随时使用、成本很低的恢复方式。']]},
{title:'决策与复盘',lead:'不必追求每次都做出完美选择；更重要的是减少可避免的错误，并从结果中学习。',items:[
['先定义真正的问题','问题定义错了，后续分析再精细也可能白费力气。先分清症状、原因和希望改变的结果。','用一句话写下问题，再补充“我希望看到什么变化”。'],
['区分可逆与不可逆决定','可逆的决定可以先小规模试验；代价高、难以撤回的决定，则值得投入更多信息和讨论。','决定前问自己：如果结果不好，我能多容易地调整？'],
['为重要决定设定标准','只凭当下情绪或零散印象，容易在不同选项间反复摇摆。明确标准可以让取舍更透明。','列出最重要的三项标准，并标注哪一项不能妥协。'],
['记录预测与结果','人容易在事后改写自己当时的判断。记录决策依据，可以帮助识别哪些判断方式可靠。','对一项重要决定，写下预期、依据和可能失败的原因。'],
['定期复盘而不自责','复盘是为了找出系统和方法中可改进的地方，不是为了证明自己不够好。','每周问三个问题：什么有效？什么没效？下次改哪一点？']]}
];
const nav=document.getElementById('nav'),content=document.getElementById('content'),filters=document.getElementById('filters'),search=document.getElementById('search');let activeCat='全部',query='';
function render(){nav.innerHTML='';content.innerHTML='';filters.innerHTML='';const all=document.createElement('button');all.textContent='全部主题';all.className=activeCat==='全部'?'selected':'';all.onclick=()=>{activeCat='全部';render()};filters.append(all);guide.forEach((g,gi)=>{const b=document.createElement('button');b.textContent=g.title;b.className=activeCat===g.title?'selected':'';b.onclick=()=>{activeCat=g.title;render();document.getElementById('s'+gi)?.scrollIntoView({behavior:'smooth',block:'start'})};filters.append(b);const a=document.createElement('a');a.href='#s'+gi;a.textContent=(gi+1)+'. '+g.title;a.className='';nav.append(a);g.items.forEach((it,ii)=>{const sub=document.createElement('a');sub.href='#e'+gi+'-'+ii;sub.className='sub';sub.textContent=(gi+1)+'.'+(ii+1)+' '+it[0];nav.append(sub)});if(activeCat!=='全部'&&activeCat!==g.title)return;const section=document.createElement('section');section.className='chapter';section.id='s'+gi;section.innerHTML=`<h2>${gi+1}. ${g.title}</h2><p class="lead">${g.lead}</p>`;g.items.forEach((it,ii)=>{const el=document.createElement('article');el.className='entry';el.id='e'+gi+'-'+ii;el.innerHTML=`<h3><span class="num">${gi+1}.${ii+1}</span>${it[0]}</h3><p>${it[1]}</p><p class="try"><strong>可以试试：</strong>${it[2]}</p>`;section.append(el)});content.append(section)});applySearch()}
function applySearch(){query=search.value.trim().toLowerCase();let shown=0;document.querySelectorAll('.chapter').forEach(sec=>{let matchCount=0;sec.querySelectorAll('.entry').forEach(entry=>{entry.querySelectorAll('mark').forEach(m=>m.replaceWith(document.createTextNode(m.textContent)));const ok=!query||entry.textContent.toLowerCase().includes(query);entry.style.display=ok?'':'none';if(ok){matchCount++;if(query){const h=entry.querySelector('h3');const text=h.textContent;const idx=text.toLowerCase().indexOf(query);if(idx>=0){h.innerHTML='';h.append(document.createTextNode(text.slice(0,idx)));const m=document.createElement('mark');m.textContent=text.slice(idx,idx+query.length);h.append(m,document.createTextNode(text.slice(idx+query.length)))}}}});sec.style.display=matchCount?'':'none';shown+=matchCount});document.getElementById('empty').style.display=shown?'none':'block';document.getElementById('intro').style.display=query?'none':'';document.getElementById('count').textContent=query?`找到 ${shown} 条相关建议`:`${guide.length} 个主题 · ${guide.reduce((n,g)=>n+g.items.length,0)} 条建议`}
search.addEventListener('input',applySearch);document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();search.focus()}if(e.key==='Escape'){search.value='';applySearch();search.blur()}});document.getElementById('themeBtn').onclick=()=>{document.body.classList.toggle('dark');document.getElementById('themeBtn').textContent=document.body.classList.contains('dark')?'日间':'夜间';try{localStorage.setItem('guide-theme',document.body.classList.contains('dark')?'dark':'light')}catch(e){}};try{if(localStorage.getItem('guide-theme')==='dark'){document.body.classList.add('dark');document.getElementById('themeBtn').textContent='日间'}}catch(e){}document.getElementById('menuBtn').onclick=()=>document.getElementById('sidebar').classList.toggle('open');nav.addEventListener('click',e=>{if(e.target.tagName==='A'&&innerWidth<=800)document.getElementById('sidebar').classList.remove('open')});window.addEventListener('scroll',()=>{const max=document.documentElement.scrollHeight-innerHeight;document.getElementById('progress').style.width=(max>0?scrollY/max*100:0)+'%';let current='';guide.forEach((g,i)=>{const el=document.getElementById('s'+i);if(el&&el.getBoundingClientRect().top<150)current='s'+i});nav.querySelectorAll('a').forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#'+current))});render();
</script></body></html>
